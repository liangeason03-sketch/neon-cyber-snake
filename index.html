<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CYBERPUNK NEON SNAKE 2077</title>
  <style>
    :root {
      --bg-dark: #070814;
      --panel-bg: rgba(14, 18, 36, 0.75);
      --neon-cyan: #00f3ff;
      --neon-pink: #ff007f;
      --neon-yellow: #ffe600;
      --neon-purple: #bc13fe;
      --neon-green: #39ff14;
      --text-main: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.06) 0%, transparent 50%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      overflow-x: hidden;
    }

    .hud-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 8px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-logo {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px rgba(0, 243, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .game-logo span {
      color: var(--neon-pink);
      font-size: 0.75rem;
      border: 1px solid var(--neon-pink);
      padding: 2px 6px;
      border-radius: 4px;
      text-shadow: none;
    }

    .hud-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      color: var(--neon-cyan);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .btn-icon:active {
      transform: scale(0.95);
      background: rgba(0, 243, 255, 0.2);
    }

    .stats-card {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 16px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 3px;
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: monospace;
    }

    .stat-val.score { color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0, 243, 255, 0.6); }
    .stat-val.high { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 230, 0, 0.6); }
    .stat-val.multiplier { color: var(--neon-pink); text-shadow: 0 0 8px rgba(255, 0, 127, 0.6); }
    .stat-val.buff { color: var(--neon-green); font-size: 0.95rem; }

    .viewport-box {
      position: relative;
      width: 100%;
      max-width: 520px;
      aspect-ratio: 1 / 1;
      border-radius: 18px;
      padding: 3px;
      background: linear-gradient(135deg, rgba(0, 243, 255, 0.6), rgba(255, 0, 127, 0.4), rgba(188, 19, 254, 0.6));
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.25), inset 0 0 15px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #090a16;
      border-radius: 15px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .scanline {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      opacity: 0.6;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 8, 20, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      display: none;
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .overlay-title.cyan {
      color: var(--neon-cyan);
      text-shadow: 0 0 15px var(--neon-cyan);
    }

    .overlay-title.pink {
      color: var(--neon-pink);
      text-shadow: 0 0 15px var(--neon-pink);
    }

    .overlay-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 24px;
      max-width: 320px;
      line-height: 1.4;
    }

    .play-btn {
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      border: none;
      color: #070814;
      font-weight: 900;
      font-size: 1rem;
      letter-spacing: 2px;
      padding: 14px 36px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .play-btn:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }

    .controls-wrapper {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    .legend-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot.cyan { background: var(--neon-cyan); box-shadow: 0 0 6px var(--neon-cyan); }
    .dot.yellow { background: var(--neon-yellow); box-shadow: 0 0 6px var(--neon-yellow); }
    .dot.purple { background: var(--neon-purple); box-shadow: 0 0 6px var(--neon-purple); }
    .dot.green { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }

    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      justify-content: center;
      align-items: center;
    }

    .dpad-btn {
      background: var(--panel-bg);
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-radius: 10px;
      color: var(--neon-cyan);
      font-size: 1.3rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn:active {
      background: rgba(0, 243, 255, 0.3);
      transform: scale(0.92);
      border-color: var(--neon-cyan);
    }

    #btnUp { grid-column: 2; grid-row: 1; }
    #btnLeft { grid-column: 1; grid-row: 2; }
    #btnDown { grid-column: 2; grid-row: 2; }
    #btnRight { grid-column: 3; grid-row: 2; }

    @media (min-width: 768px) {
      .dpad-container {
        display: none; /* Hide on desktop */
      }
    }
  </style>
</head>
<body>

  <header class="hud-container">
    <div class="top-bar">
      <div class="game-logo">
        CYBERSNAKE <span>NEON-77</span>
      </div>
      <div class="hud-actions">
        <button id="soundBtn" class="btn-icon">🔊 聲音</button>
        <button id="pauseBtn" class="btn-icon">⏸ 暫停</button>
      </div>
    </div>

    <div class="stats-card">
      <div>
        <div class="stat-label">分數</div>
        <div id="uiScore" class="stat-val score">0</div>
      </div>
      <div>
        <div class="stat-label">最高分</div>
        <div id="uiHighScore" class="stat-val high">0</div>
      </div>
      <div>
        <div class="stat-label">倍率</div>
        <div id="uiMultiplier" class="stat-val multiplier">x1</div>
      </div>
      <div>
        <div class="stat-label">狀態</div>
        <div id="uiBuff" class="stat-val buff">常態</div>
      </div>
    </div>
  </header>

  <main class="viewport-box">
    <div class="canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
      <div class="scanline"></div>

      <!-- Start Overlay -->
      <div id="startOverlay" class="overlay">
        <h1 class="overlay-title cyan">賽博貪吃蛇</h1>
        <p class="overlay-desc">控制高能光子蛇吞噬能量核心！閃避自身軌跡，拾取特殊道具解鎖超頻倍率。</p>
        <button id="startPlayBtn" class="play-btn">啟動核心 (START)</button>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="overlay hidden">
        <h2 class="overlay-title pink">信號終止</h2>
        <p id="overReason" class="overlay-desc">光子回路自我短路！本次得分：0</p>
        <button id="restartBtn" class="play-btn">重新連接 (RETRY)</button>
      </div>

      <!-- Pause Overlay -->
      <div id="pauseOverlay" class="overlay hidden">
        <h2 class="overlay-title cyan">系統暫停</h2>
        <p class="overlay-desc">核心充能掛起中，點擊繼續恢復運行。</p>
        <button id="resumeBtn" class="play-btn">繼續運行 (RESUME)</button>
      </div>
    </div>
  </main>

  <footer class="controls-wrapper">
    <div class="legend-row">
      <div class="legend-item"><span class="dot cyan"></span>標準點 +10</div>
      <div class="legend-item"><span class="dot yellow"></span>星體核心 +50</div>
      <div class="legend-item"><span class="dot green"></span>慢速力場 (緩速)</div>
      <div class="legend-item"><span class="dot purple"></span>光子引力 (磁力)</div>
    </div>

    <!-- On-screen D-Pad for Mobile -->
    <div class="dpad-container">
      <button id="btnUp" class="dpad-btn">▲</button>
      <button id="btnLeft" class="dpad-btn">◀</button>
      <button id="btnDown" class="dpad-btn">▼</button>
      <button id="btnRight" class="dpad-btn">▶</button>
    </div>
  </footer>

  <script>
    class RetroSound {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggle() {
        this.muted = !this.muted;
        return !this.muted;
      }
      tone(freq, type = 'sine', duration = 0.1, stopFreq = null) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          if (stopFreq !== null) {
            osc.frequency.exponentialRampToValueAtTime(stopFreq, this.ctx.currentTime + duration);
          }
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }
      eatNormal() { this.tone(520, 'square', 0.08, 780); }
      eatStar() { this.tone(600, 'sine', 0.16, 1200); }
      eatBuff() { this.tone(350, 'sawtooth', 0.25, 880); }
      die() { this.tone(280, 'sawtooth', 0.4, 40); }
    }

    const sound = new RetroSound();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_COUNT = 20; // 20x20 grid
    let cellSize = 20;
    let actualWidth = 400;
    let actualHeight = 400;

    function resizeCanvas() {
      const container = canvas.parentElement;
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      actualWidth = Math.floor(rect.width);
      actualHeight = Math.floor(rect.height);

      canvas.width = Math.floor(actualWidth * dpr);
      canvas.height = Math.floor(actualHeight * dpr);

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);

      cellSize = actualWidth / GRID_COUNT;
    }

    window.addEventListener('resize', resizeCanvas);

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = null;
    let powerUp = null;
    let particles = [];

    let score = 0;
    let highScore = parseInt(localStorage.getItem('cyber_snake_hi') || '0', 10);
    let combo = 1;
    let comboTimeout = null;

    let isPlaying = false;
    let isPaused = false;
    let lastTickTime = 0;
    let baseSpeed = 120; // ms per grid move
    let activeBuff = null; // 'slow' | 'magnet'
    let buffEndTime = 0;

    // DOM caches
    const uiScore = document.getElementById('uiScore');
    const uiHighScore = document.getElementById('uiHighScore');
    const uiMultiplier = document.getElementById('uiMultiplier');
    const uiBuff = document.getElementById('uiBuff');

    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const pauseOverlay = document.getElementById('pauseOverlay');
    const overReason = document.getElementById('overReason');

    uiHighScore.textContent = highScore;

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.5 + 1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.life = 1.0;
        this.decay = Math.random() * 0.03 + 0.02;
        this.size = Math.random() * 3.5 + 1.5;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }
      draw(c) {
        if (this.life <= 0) return;
        c.save();
        c.globalAlpha = Math.max(0, this.life);
        c.shadowColor = this.color;
        c.shadowBlur = 8;
        c.fillStyle = this.color;
        c.beginPath();
        c.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        c.fill();
        c.restore();
      }
    }

    function createExplosion(gridX, gridY, color, count = 15) {
      const px = (gridX + 0.5) * cellSize;
      const py = (gridY + 0.5) * cellSize;
      for (let i = 0; i < count; i++) {
        particles.push(new Particle(px, py, color));
      }
    }

    function getFreeSpot() {
      const occupied = new Set();
      snake.forEach(s => occupied.add(`${s.x},${s.y}`));
      if (food) occupied.add(`${food.x},${food.y}`);
      if (powerUp) occupied.add(`${powerUp.x},${powerUp.y}`);

      const free = [];
      for (let x = 0; x < GRID_COUNT; x++) {
        for (let y = 0; y < GRID_COUNT; y++) {
          if (!occupied.has(`${x},${y}`)) {
            free.push({ x, y });
          }
        }
      }
      if (free.length === 0) return { x: 0, y: 0 };
      return free[Math.floor(Math.random() * free.length)];
    }

    function spawnFood() {
      const spot = getFreeSpot();
      food = {
        x: spot.x,
        y: spot.y,
        isBonus: Math.random() < 0.2 // 20% golden star
      };
    }

    function maybeSpawnPowerUp() {
      if (powerUp) return;
      if (Math.random() < 0.3) {
        const spot = getFreeSpot();
        const types = ['slow', 'magnet'];
        powerUp = {
          x: spot.x,
          y: spot.y,
          type: types[Math.floor(Math.random() * types.length)],
          expire: Date.now() + 9000 // 9s lifetime on grid
        };
      }
    }

    function updateCombo() {
      combo = Math.min(combo + 1, 8);
      uiMultiplier.textContent = `x${combo}`;
      clearTimeout(comboTimeout);
      comboTimeout = setTimeout(() => {
        combo = 1;
        uiMultiplier.textContent = 'x1';
      }, 4000);
    }

    function resetGame() {
      const center = Math.floor(GRID_COUNT / 2);
      // Explicit 4-segment initial snake in center of grid
      snake = [
        { x: center, y: center },
        { x: center - 1, y: center },
        { x: center - 2, y: center },
        { x: center - 3, y: center }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      combo = 1;
      activeBuff = null;
      powerUp = null;
      particles = [];
      isPlaying = true;
      isPaused = false;

      uiScore.textContent = '0';
      uiMultiplier.textContent = 'x1';
      uiBuff.textContent = '常態';

      spawnFood();

      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      pauseOverlay.classList.add('hidden');
    }

    function gameOver(reason) {
      isPlaying = false;
      sound.die();
      createExplosion(snake[0].x, snake[0].y, '#ff007f', 30);

      overReason.textContent = `${reason} 本次得分：${score}`;
      gameOverOverlay.classList.remove('hidden');

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cyber_snake_hi', highScore.toString());
        uiHighScore.textContent = highScore;
      }
    }

    function changeDirection(dx, dy) {
      sound.init();
      // Prevent 180 reverse suicide
      if (dx !== 0 && dir.x !== 0) return;
      if (dy !== 0 && dir.y !== 0) return;
      nextDir = { x: dx, y: dy };
    }

    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          e.preventDefault();
          changeDirection(0, -1);
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          e.preventDefault();
          changeDirection(0, 1);
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          e.preventDefault();
          changeDirection(-1, 0);
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          e.preventDefault();
          changeDirection(1, 0);
          break;
        case ' ':
          e.preventDefault();
          togglePause();
          break;
      }
    });

    // Touch and D-pad controls
    document.getElementById('btnUp').onclick = () => changeDirection(0, -1);
    document.getElementById('btnDown').onclick = () => changeDirection(0, 1);
    document.getElementById('btnLeft').onclick = () => changeDirection(-1, 0);
    document.getElementById('btnRight').onclick = () => changeDirection(1, 0);

    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', (e) => {
      sound.init();
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
        if (Math.abs(dx) > Math.abs(dy)) {
          changeDirection(dx > 0 ? 1 : -1, 0);
        } else {
          changeDirection(0, dy > 0 ? 1 : -1);
        }
      }
    }, { passive: true });

    function stepGame() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
        gameOver('撞擊邊界防火牆！');
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver('回路衝突，咬到自體！');
        return;
      }

      snake.unshift(head);

      // Check magnet buff pull (attracts food if within 2 tiles)
      if (activeBuff === 'magnet' && food) {
        const dist = Math.hypot(food.x - head.x, food.y - head.y);
        if (dist <= 2.5 && dist > 0) {
          if (food.x < head.x) food.x++;
          else if (food.x > head.x) food.x--;
          if (food.y < head.y) food.y++;
          else if (food.y > head.y) food.y--;
        }
      }

      // Check food intake
      if (food && head.x === food.x && head.y === food.y) {
        const pts = (food.isBonus ? 50 : 10) * combo;
        score += pts;
        uiScore.textContent = score;

        if (food.isBonus) {
          sound.eatStar();
          createExplosion(food.x, food.y, '#ffe600', 20);
        } else {
          sound.eatNormal();
          createExplosion(food.x, food.y, '#00f3ff', 12);
        }

        updateCombo();
        spawnFood();
        maybeSpawnPowerUp();
      } else if (powerUp && head.x === powerUp.x && head.y === powerUp.y) {
        // Collect powerup
        activeBuff = powerUp.type;
        buffEndTime = Date.now() + 7000;
        sound.eatBuff();
        createExplosion(powerUp.x, powerUp.y, activeBuff === 'slow' ? '#39ff14' : '#bc13fe', 22);

        uiBuff.textContent = activeBuff === 'slow' ? '緩速力場' : '光子磁吸';
        powerUp = null;
      } else {
        snake.pop(); // regular move
      }

      // Check powerup expiration
      if (powerUp && Date.now() > powerUp.expire) {
        powerUp = null;
      }

      // Check active buff timeout
      if (activeBuff && Date.now() > buffEndTime) {
        activeBuff = null;
        uiBuff.textContent = '常態';
      }
    }

    function render() {
      // Clear background
      ctx.fillStyle = '#090a16';
      ctx.fillRect(0, 0, actualWidth, actualHeight);

      // Draw subtle grid lines
      ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_COUNT; i++) {
        const p = i * cellSize;
        ctx.beginPath();
        ctx.moveTo(p, 0);
        ctx.lineTo(p, actualHeight);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, p);
        ctx.lineTo(actualWidth, p);
        ctx.stroke();
      }

      // Draw Food
      if (food) {
        const fx = (food.x + 0.5) * cellSize;
        const fy = (food.y + 0.5) * cellSize;
        const pulse = 1 + Math.sin(Date.now() / 150) * 0.15;
        const rad = (cellSize * 0.38) * pulse;

        ctx.save();
        if (food.isBonus) {
          ctx.shadowColor = '#ffe600';
          ctx.shadowBlur = 18;
          ctx.fillStyle = '#ffe600';
        } else {
          ctx.shadowColor = '#00f3ff';
          ctx.shadowBlur = 16;
          ctx.fillStyle = '#00f3ff';
        }
        ctx.beginPath();
        ctx.arc(fx, fy, rad, 0, Math.PI * 2);
        ctx.fill();

        // Core highlight
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(fx, fy, rad * 0.45, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Draw PowerUp
      if (powerUp) {
        const px = (powerUp.x + 0.5) * cellSize;
        const py = (powerUp.y + 0.5) * cellSize;
        const col = powerUp.type === 'slow' ? '#39ff14' : '#bc13fe';

        ctx.save();
        ctx.shadowColor = col;
        ctx.shadowBlur = 18;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(px, py, cellSize * 0.42, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#070814';
        ctx.font = `bold ${Math.floor(cellSize * 0.5)}px monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(powerUp.type === 'slow' ? 'S' : 'M', px, py);
        ctx.restore();
      }

      // Draw Snake Body & Head (High visibility neon layers)
      if (snake.length > 0) {
        for (let i = snake.length - 1; i >= 0; i--) {
          const seg = snake[i];
          const px = seg.x * cellSize + 1.5;
          const py = seg.y * cellSize + 1.5;
          const size = cellSize - 3;
          const isHead = (i === 0);

          ctx.save();
          if (isHead) {
            // Distinct ultra glowing head
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#00f3ff';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(px, py, size, size, 6);
            ctx.fill();
            ctx.stroke();

            // Head Sensor Eyes
            ctx.fillStyle = '#ff007f';
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 8;
            const eyeSize = Math.max(2, cellSize * 0.16);
            let e1x = px + size * 0.3, e1y = py + size * 0.3;
            let e2x = px + size * 0.7, e2y = py + size * 0.3;

            if (dir.x === 1) { // Right
              e1x = px + size * 0.7; e1y = py + size * 0.25;
              e2x = px + size * 0.7; e2y = py + size * 0.75;
            } else if (dir.x === -1) { // Left
              e1x = px + size * 0.3; e1y = py + size * 0.25;
              e2x = px + size * 0.3; e2y = py + size * 0.75;
            } else if (dir.y === 1) { // Down
              e1x = px + size * 0.25; e1y = py + size * 0.7;
              e2x = px + size * 0.75; e2y = py + size * 0.7;
            }

            ctx.beginPath();
            ctx.arc(e1x, e1y, eyeSize, 0, Math.PI * 2);
            ctx.arc(e2x, e2y, eyeSize, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // Body gradient trail
            const ratio = i / snake.length;
            const alpha = Math.max(0.45, 1 - ratio * 0.55);
            ctx.shadowColor = '#bc13fe';
            ctx.shadowBlur = 10;
            ctx.fillStyle = `rgba(188, 19, 254, ${alpha})`;
            ctx.beginPath();
            ctx.roundRect(px, py, size, size, 4);
            ctx.fill();

            // Inner core neon vein
            ctx.fillStyle = `rgba(0, 243, 255, ${alpha * 0.7})`;
            ctx.fillRect(px + size * 0.25, py + size * 0.25, size * 0.5, size * 0.5);
          }
          ctx.restore();
        }
      }

      // Draw Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw(ctx);
        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function engine(timestamp) {
      if (!lastTickTime) lastTickTime = timestamp;
      const delta = timestamp - lastTickTime;

      if (isPlaying && !isPaused) {
        let currentInterval = baseSpeed;
        if (activeBuff === 'slow') currentInterval += 70; // slow down
        // Speed up slightly as snake grows
        currentInterval = Math.max(65, currentInterval - Math.floor(snake.length / 3) * 2);

        if (delta >= currentInterval) {
          stepGame();
          lastTickTime = timestamp;
        }
      }

      render();
      requestAnimationFrame(engine);
    }

    function togglePause() {
      if (!isPlaying) return;
      isPaused = !isPaused;
      if (isPaused) {
        pauseOverlay.classList.remove('hidden');
      } else {
        pauseOverlay.classList.add('hidden');
      }
    }

    document.getElementById('pauseBtn').onclick = togglePause;
    document.getElementById('resumeBtn').onclick = togglePause;

    document.getElementById('soundBtn').onclick = () => {
      const active = sound.toggle();
      document.getElementById('soundBtn').textContent = active ? '🔊 聲音' : '🔇 靜音';
    };

    document.getElementById('startPlayBtn').onclick = () => {
      sound.init();
      resetGame();
    };

    document.getElementById('restartBtn').onclick = () => {
      sound.init();
      resetGame();
    };

    // Initial setup on boot
    window.addEventListener('load', () => {
      resizeCanvas();
      // Render static initial preview behind start modal
      const center = Math.floor(GRID_COUNT / 2);
      snake = [
        { x: center, y: center },
        { x: center - 1, y: center },
        { x: center - 2, y: center }
      ];
      spawnFood();
      render();
      requestAnimationFrame(engine);
    });
  </script>
</body>
</html>
